<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screenshot copied</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .toast {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border: 1px solid rgba(34, 197, 94, 0.32);
        border-radius: 14px;
        background: rgba(15, 23, 42, 0.9);
        color: #f8fafc;
        box-shadow: 0 18px 44px rgba(15, 23, 42, 0.32);
        animation: toast-in 0.16s ease-out;
      }

      .icon {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        border-radius: 999px;
        background: #22c55e;
        color: #052e16;
        font-size: 18px;
        font-weight: 900;
        line-height: 1;
      }

      .copy {
        display: grid;
        gap: 2px;
        min-width: 0;
      }

      .title {
        font-size: 13px;
        font-weight: 750;
        line-height: 1.1;
      }

      .subtitle {
        color: #cbd5e1;
        font-size: 11px;
        font-weight: 550;
        line-height: 1.1;
      }

      @keyframes toast-in {
        from {
          opacity: 0;
          transform: translateY(6px) scale(0.98);
        }

        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div class="toast" role="status" aria-live="polite">
      <div class="icon" aria-hidden="true">OK</div>
      <div class="copy">
        <div class="title">Screenshot copied</div>
        <div class="subtitle">Ready to paste</div>
      </div>
    </div>
  </body>
</html>
