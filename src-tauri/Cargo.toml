[package]
name = "translation-desktop"
version = "1.0.0"
description = "Desktop OCR translation app"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "translation_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.11.5", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
screenshots = "0.8"
base64 = "0.22"
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Threading", "Win32_System_LibraryLoader"] }

tauri-plugin-autostart = "2"
reqwest = { version = "0.12", features = ["json"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["time"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tauri = { version = "~2.11.5", features = ["test"] }

[features]
latency-harness = []
