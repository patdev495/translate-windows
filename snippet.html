<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PolyTranslate Snippet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/snippet.css" />
    <script type="module" src="/src/snippet.ts" defer></script>
  </head>
  <body>
    <div id="snippet-card" class="snippet-card">
      <div class="image-wrapper">
        <img id="snippet-img" class="snippet-img" alt="Cropped OCR region" />
      </div>
      <button id="close-btn" class="close-btn" title="Close" type="button">
        <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </body>
</html>
