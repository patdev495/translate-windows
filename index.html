<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
    <script>
      // Apply overlay-mode synchronously before the first browser paint so the
      // window never renders with the default #f6f6f6 background. CSS rules for
      // html.overlay-mode set background: transparent, eliminating any white flash
      // when the overlay window is opened.
      if (new URLSearchParams(location.search).get('overlay') === '1') {
        document.documentElement.classList.add('overlay-mode');
      }
    </script>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <img id="overlay-bg" class="overlay-bg" style="display: none;" />
    <canvas id="crop-canvas" class="crop-canvas" style="display: none;"></canvas>
    <div id="translation-overlay-container" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100;"></div>
    <div id="translation-control-bar" class="translation-control-bar" style="display: none; position: absolute; z-index: 200;">
      <button id="toggle-view-btn" class="control-btn">👁 Show Original</button>
      <button id="open-details-btn" class="control-btn">📝 Open Details</button>
      <button id="close-overlay-btn" class="control-btn">❌ Close</button>
    </div>
    <div id="recording-control-bar" class="recording-control-bar" style="display: none; position: absolute; z-index: 220;">
      <div id="recording-status" class="recording-status">Select area</div>
      <button id="recording-start-btn" class="recording-btn">Start</button>
      <button id="recording-stop-btn" class="recording-btn danger" style="display: none;">Stop</button>
      <button id="recording-cancel-btn" class="recording-btn">Cancel</button>
    </div>
    <main class="container" id="main-container" hidden></main>
  </body>
</html>
